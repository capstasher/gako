name: Build APK

# Pushes to main and pull requests build and test the APK (kept as a workflow artifact).
#
# Releases: add docs/releases/vX.Y.Z.md (the notes) on main. The first push to main that has notes
# for a version not released yet builds that release, tags it and publishes it. Pushing a tag
# vX.Y.Z does the same. Releases are signed with the private release key only.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            latest=$(ls docs/releases/v*.md 2>/dev/null | xargs -n1 basename | sed 's/\.md$//' | sort -V | tail -1)
            if [ -n "$latest" ] && ! gh release view "$latest" >/dev/null 2>&1; then
              tag="$latest"
              echo "Notes for $latest are on main and it isn't released yet: this build is the release."
            fi
          fi
          if [ -n "$tag" ]; then
            echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
            echo "GAKO_VERSION=${tag#v}" >> "$GITHUB_ENV"
            echo "GAKO_RELEASE=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Host tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build pkg-config libglib2.0-dev-bin
          pip install --user meson==1.12.1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Pick NDK
        id: ndk
        run: |
          echo "home=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_OUTPUT"
          echo "version=$(basename "$ANDROID_NDK_LATEST_HOME")" >> "$GITHUB_OUTPUT"

      - name: Restore native build
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/native/src
            build/native/android-arm64
          key: native-arm64-${{ steps.ndk.outputs.version }}-${{ hashFiles('native/versions.env', 'native/build-native.sh') }}

      - name: Build engine (glib, json-glib, libpng, libjpeg-turbo, babl, GEGL) and bridge
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.home }}
        run: native/build-native.sh android-arm64

      - name: Save native build
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/native/src
            build/native/android-arm64
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: Stage jniLibs
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.home }}
        run: native/stage-jnilibs.sh android-arm64 arm64-v8a

      - name: Release signing key
        env:
          KEYSTORE_B64: ${{ secrets.GAKO_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/gako.jks"
            echo "GAKO_KEYSTORE=$RUNNER_TEMP/gako.jks" >> "$GITHUB_ENV"
          elif [ -n "${GAKO_RELEASE:-}" ]; then
            echo "::error::Releases must be signed with the private release key: add the GAKO_KEYSTORE_B64 and GAKO_KEYSTORE_PASSWORD secrets."
            exit 1
          else
            echo "No GAKO_KEYSTORE_B64 secret (e.g. a fork's pull request): signing with the repo's dev key."
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build APK
        env:
          GAKO_KEYSTORE_PASSWORD: ${{ secrets.GAKO_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          name="gako-${GAKO_VERSION:-build${GITHUB_RUN_NUMBER}}-arm64.apk"
          cp app/build/outputs/apk/release/*.apk "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs "dist/$name" | tee signer.txt
          echo "CERT_SHA256=$(sed -n 's/.*certificate SHA-256 digest: //p' signer.txt | head -1)" >> "$GITHUB_ENV"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: gako-apk
          path: dist/*

      - name: Publish release
        if: env.GAKO_RELEASE == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${RELEASE_TAG}.md"
          [ -f "$notes" ] || { echo "::error::Missing release notes: $notes"; exit 1; }
          { cat "$notes"; printf '\n---\nSigning certificate SHA-256: `%s`\n' "$CERT_SHA256"; } > "$RUNNER_TEMP/notes.md"
          gh release create "$RELEASE_TAG" dist/* --target "$GITHUB_SHA" --latest \
            --title "GAKO $GAKO_VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          # The rolling "dev" pre-release from before proper releases; gone once one exists.
          gh release delete dev --yes --cleanup-tag 2>/dev/null || true
